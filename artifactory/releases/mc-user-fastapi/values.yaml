# Values de dev para mc-user-fastapi en el lab. publish-release-chart.sh la
# envuelve bajo la clave "microservice:" (nombre de la dependencia) y la
# empaqueta junto con un Chart.yaml que solo declara esa dependencia — esto
# es lo único que se mantiene a mano por microservicio/entorno. Un
# microservicio nuevo necesita su propia carpeta bajo artifactory/releases/,
# no reusar esta.
#
# image.repository/image.tag los pisa y los commitea de vuelta aquí
# mc-user-fastapi/.github/workflows/deploy-lab.yml en cada deploy — no los
# edites a mano, se van a sobreescribir en el próximo run. El resto de
# campos sí son a mano.
#
# nameOverride obligatorio: sin subchart, los templates ven .Chart.Name
# del chart genérico ("microservice"), no el nombre real de la app.
nameOverride: mc-user-fastapi
replicaCount: 1
image:
  repository: docker.io/elioxrom/mc-user-fastapi
  tag: "lab-dev-6-ec64599e"
resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    cpu: 300m
    memory: 384Mi
autoscaling:
  enabled: false
networkPolicy:
  enabled: false
