# Microservicio real desplegado vía la instancia argocd-it4t, directo en el
# hub (sin spoke) con un namespace por entorno.
#
# ArgoCD no soporta usar un chart Helm como fuente "ref" para $values en
# multi-source (solo funciona con repos git), así que ya no se separan
# "chart" y "values" en dos fuentes. El pipeline publica un chart "wrapper"
# por microservicio/entorno (ver ../../artifactory/publish-release-chart.sh):
# lo único hecho a mano es un values.yaml; el chart genérico
# (https://github.com/elioxrome/generic-charts-ms, publicado aparte y
# versionado por ../../artifactory/publish-chart.sh) se trae como
# DEPENDENCIA real de Helm y queda vendorizado dentro del .tgz final.
# ArgoCD solo necesita UNA fuente: ese chart ya versionado y autocontenido.
# Requiere que ../../artifactory/register-argocd-repo.sh it4t ya haya
# registrado las credenciales de ese repo en este namespace.
#
# Generador "list": una entrada por entorno. Para sumar uno nuevo, publica
# su release chart (mc-user-fastapi-0.1.0-<env>) y agrega su línea aquí.
#
# Solo "dev" por ahora: su imagen (dev-8-a7f71b75) existe en docker hub.
# stg (1.0.0-rc) y prd (1.0.0) todavía no tienen imagen publicada.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mc-user-fastapi
  namespace: argocd-it4t
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
          # - env: stg   # agregar cuando exista la imagen 1.0.0-rc
          # - env: prd   # agregar cuando exista la imagen 1.0.0
  template:
    metadata:
      name: "mc-user-fastapi-{{.env}}"
    spec:
      project: default
      source:
        repoURL: http://artifactory.artifactory.svc.cluster.local:8082/artifactory/example-repo-local/charts-values
        chart: mc-user-fastapi
        targetRevision: "0.1.0-{{.env}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "apps-{{.env}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
