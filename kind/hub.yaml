# Clúster "hub" (un solo nodo para ahorrar RAM)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: hub
nodes:
  - role: control-plane
    extraPortMappings:
      # NodePort HTTPS de argocd-server -> https://localhost:8443
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
